---
- name: install for cutie {fedora}
  dnf:
    name:
      - git
      - git-lfs
      - vim
      - flatpak
      - podman
      - podman-docker
      - podman-compose
      - firewalld
      - firewall-config
      - firewall-applet
      - gnome-tweaks
      - papirus-icon-theme
      - ptyxis
      - helix
      - cargo
      - btop
      - fuse
      - "@virtualization"
      - fuse-libs
      - snapper
      - python3-dnf-plugin-snapper
      - btrfs-assistant
      - freerdp
      - gtk-layer-shell
      - rustup
      - golang
      - bat
      - uv
      - tailscale
      - unityhub
      - code
      - steam
      - ansible
      - ansible-lint
      
    state: present

  any_errors_fatal: true
  when:
    - ansible_facts['distribution'] in ['Fedora']
    - inventory_hostname in groups['Desktop']
  become: true

- name: install for cutie {Rocky} not ready
  dnf:
    name:
      - git
      - git-lfs
      - vim
      - flatpak
      - podman
      - podman-docker
      - podman-compose
      - firewalld
      - firewall-config
      - firewall-applet
      - gnome-tweaks
      - papirus-icon-theme
      - gnome-terminal
      - nautilus
      - gnome-software
      - gnome-session
      - gnome-shell
      - gnome-control-center
      - gdm
      - NetworkManager-wifi
      - wpa_supplicant
      - helix
      - cargo
      - btop
      - fuse
      # Virtualization Area
      - qemu-kvm 
      - libvirt 
      - virt-manager 
      - virt-install 
      - virt-viewer 
      - bridge-utils 
      - libguestfs-tools
      # Done
      - fuse-libs
      - freerdp
      - gtk-layer-shell
      - golang
      - bat
      - pipx
      - tailscale
      - unityhub
      - code
      - steam
      - ansible
      - ansible-lint

    state: present

  any_errors_fatal: true
  when:
    - ansible_facts['distribution'] in ['Rocky']
    - inventory_hostname in groups['Desktop']
  become: true
    
- name: install rust lang~ for cutie (Desktop)
  ansible.builtin.command: "rustup-init --profile default --default-toolchain stable --default-host x86_64-unknown-linux-gnu -y"
  when:
    - inventory_hostname in groups['Desktop']
    - ansible_facts['distribution'] in ['Fedora']

- name: install for (server{fedora})
  dnf:
    name:
      - git
      - git-lfs
      - podman
      - podman-docker
      - podman-compose
      - firewalld
      - helix
      - snapper
      - python3-dnf-plugin-snapper
      - tailscale
      - node-exporter
      - bat
      - btop
      - cockpit
      - cockpit-files
      - cockpit-session-recording
      - cockpit-selinux
      - cockpit-podman
      - cockpit-ws
      - cockpit-ws-selinux
      - cockpit-networkmanager
      - cockpit-packagekit
      - cockpit-storaged
      - fail2ban
      - curl
      - wget

    state: present

  any_errors_fatal: true
  when:
    - ansible_facts['distribution'] in ['Fedora', 'Rocky']
    - inventory_hostname in groups['Servers']
  become: true

- name: install gnome extension for cutie {fedora}
  dnf:
    name:
      - gnome-shell-extension-pop-shell
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-blur-my-shell
      - gnome-shell-extension-caffeine
      - gnome-shell-extension-dash-to-dock
      - gnome-shell-extension-just-perfection

  any_errors_fatal: true
  when:
    - ansible_facts['distribution'] in ['Fedora']
    - inventory_hostname in groups['Desktop']
    - ansible_facts['env']['XDG_CURRENT_DESKTOP'] == "GNOME"
  become: true

- name: install gnome extension for cutie {Rocky}
  dnf:
    name:
      - gnome-shell-extension-pop-shell
      - gnome-shell-extension-caffeine
      - gnome-shell-extension-dash-to-dock
      - gnome-shell-extension-just-perfection

  any_errors_fatal: true
  when:
    - ansible_facts['distribution'] in ['Rocky']
    - inventory_hostname in groups['Desktop']
    - ansible_facts['env']['XDG_CURRENT_DESKTOP'] == "GNOME"
  become: true

