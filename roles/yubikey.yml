---

  - name: create a ~/.config/Yubico
    ansible.builtin.file:
      path: ~/.config/Yubico
      state: directory
      mode: '0700'

  - name: u2f_keys copy
    ansible.builtin.copy:
      src: u2f_keys
      dest: ~/.config/Yubico/u2f_keys
      mode: '0600'

  - name: check authselect status
    ansible.builtin.command: authselect current
    register: authselect_status
    changed_when: false
    become: true

  - name: Fedora authselect with-pam-u2f feature enable
    when: "'with-pam-u2f' not in authselect_status.stdout"
    become: true
    block:
      - name: with-pam-u2f feature enable
        ansible.builtin.command: authselect enable-feature with-pam-u2f

      - name: authselect apply changes
        ansible.builtin.command: authselect apply-changes
