---
- name: Enable and start the tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true

- name: Enable and start the node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
  when:
    - ansible_facts['distribution'] == "Fedora"
    - inventory_hostname in groups['Servers']
  become: true

- name: Enable and start the cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  when:
    - ansible_facts['distribution'] == "Fedora"
    - inventory_hostname in groups['Servers']
  become: true

- name: Enable and start the fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: yes
  become: true
  when:
    - inventory_hostname in groups['Servers']

- name: Enable and start the user mode podman socket
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  when:
    - inventory_hostname in groups['Servers']

- name: Configure and restart systemd-oomd on cutie
  block:
    - name: Create oomd config directory
      ansible.builtin.file:
        path: /etc/systemd/oomd.conf.d
        state: directory
        mode: '0755'

    - name: Write oomd config
      ansible.builtin.copy:
        dest: /etc/systemd/oomd.conf.d/99-oomd-defaults.conf
        content: |
          [OOM]
          SwapUsedLimit=80%
          DefaultMemoryPressureLimit=60%
          DefaultMemoryPressureDurationSec=5s
        mode: '0644'

    - name: Restart systemd-oomd
      ansible.builtin.systemd:
        name: systemd-oomd
        state: restarted
  become: true
  when:
    - inventory_hostname in groups['Desktop']
    - ansible_facts['distribution'] == "Fedora"
    - ansible_facts['hostname'] == "cutie"